<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Almacén - Minimarket La Ruta del Este</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0F0F14;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .login-card {
            background-color: #16161F;
            border: 1px solid #2A2A38;
            border-radius: 16px;
            padding: 30px 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .brand-hdr {
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
        }
        .form-control {
            background-color: #0F0F14;
            border: 1px solid #2A2A38;
            color: #FFFFFF;
            padding: 12px 15px;
            border-radius: 10px;
        }
        .form-control:focus {
            background-color: #0F0F14;
            border-color: #2563EB;
            color: #FFFFFF;
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.25);
        }
        .btn-accent {
            background-color: #2563EB;
            color: white;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-accent:hover {
            background-color: #1D4ED8;
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-hdr">
            <h4 class="fw-bold m-0 text-white">📦 PORTAL DE ALMACÉN</h4>
            <small class="text-blue-200">Minimarket La Ruta del Este</small>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 text-center small mb-3">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label small text-secondary fw-semibold">USUARIO DE SISTEMA</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Ingrese su usuario..." required autofocus>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small text-secondary fw-semibold">CONTRASEÑA</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-accent">🔐 Iniciar Sesión en Almacén</button>
        </form>

        <div class="text-center mt-4">
            <a href="/whatsapp" class="text-secondary text-decoration-none small">📱 Regresar a Consulta Vendedores</a>
        </div>
    </div>

</body>
</html>
