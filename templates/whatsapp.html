<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Rápida Pedidos WhatsApp - La Ruta del Este</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0B0B0E;
            color: #FFFFFF;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .header-box {
            background: linear-gradient(135deg, #059669 0%, #10B981 100%);
            padding: 20px 15px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .search-card {
            background-color: #16161F;
            border-radius: 15px;
            padding: 15px;
            margin-top: -20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .product-item {
            background-color: #1E1E2A;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #2A2A38;
        }
        .stock-tag {
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header-box text-center text-white">
        <h4 class="fw-bold m-0">📱 CONSULTA PEDIDOS WHATSAPP</h4>
        <small>Minimarket La Ruta del Este | Tiempo Real SQL Server</small>
    </div>

    <div class="container pb-5">
        <div class="search-card">
            <input type="text" id="txt-query" class="form-control form-control-lg bg-dark text-white border-0 shadow-none" placeholder="🔍 Escribe nombre o código..." autofocus>
        </div>

        <div id="results-container" class="mt-4">
            <div class="text-center text-muted py-5">
                <p>Escribe el nombre de un producto para verificar disponibilidad instantánea en inventario.</p>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('txt-query');
        const container = document.getElementById('results-container');

        input.addEventListener('input', function() {
            const q = this.value.trim();
            if(q.length < 1) {
                container.innerHTML = '<div class="text-center text-muted py-5"><p>Escribe el nombre de un producto para verificar disponibilidad instantánea en inventario.</p></div>';
                return;
            }

            fetch(`/api/search?q=${encodeURIComponent(q)}`)
                .then(res => res.json())
                .then(data => {
                    if(data.length === 0) {
                        container.innerHTML = '<div class="alert alert-dark text-center">No se encontraron productos coincidentes.</div>';
                        return;
                    }

                    let html = '';
                    data.forEach(p => {
                        let badgeClass = 'bg-success';
                        let statusText = `DISPONIBLE (${p.stock_actual} en stock)`;

                        if(p.stock_actual <= 0) {
                            badgeClass = 'bg-danger';
                            statusText = 'AGOTADO EN ALMACÉN';
                        } else if(p.stock_actual <= p.stock_minimo) {
                            badgeClass = 'bg-warning text-dark';
                            statusText = `ÚLTIMAS UNIDADES (${p.stock_actual} en stock)`;
                        }

                        html += `
                            <div class="product-item">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <div>
                                        <h6 class="fw-bold m-0 text-white">${p.nombre}</h6>
                                        <small class="text-secondary">${p.categoria_nombre || 'General'} | Cód: ${p.codigo_barras}</small>
                                    </div>
                                    <span class="fs-5 fw-bold text-success">RD$ ${p.precio_venta.toFixed(2)}</span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <span class="stock-tag ${badgeClass}">${statusText}</span>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                });
        });
    </script>
</body>
</html>
